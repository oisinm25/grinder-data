# On-demand workout analysis (docs/roadmap.md, v1.4). Runs when a request file is pushed to the
# `requests` branch (requests/<timestamp>.json, see that branch's README), or by hand. No time
# window. It writes only derived/analysis/ to the data branch: never the calendar, never today.json,
# never main.
name: analyse

on:
  push:
    branches: [requests]
  workflow_dispatch:
    inputs:
      activity:
        description: '"latest" or an intervals.icu activity id'
        default: latest
        required: true

# Only what's needed to push the data branch.
permissions:
  contents: write

concurrency: { group: analyse, cancel-in-progress: false }

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out main (code, plan, strength log)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Which activity
        id: req
        env:
          EVENT: ${{ github.event_name }}
          INPUT: ${{ github.event.inputs.activity }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            activity="$INPUT"
          else
            git fetch --depth=2 origin requests
            file=$(git diff-tree --no-commit-id --name-only -r --diff-filter=AM "$SHA" | grep -E '^requests/[^/]+\.json$' | sort | tail -n 1)
            if [ -z "$file" ]; then
              echo "no request file in this push (e.g. a README change): nothing to do"
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            activity=$(git show "$SHA:$file" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("activity", "latest"))')
          fi
          if ! printf '%s' "$activity" | grep -Eq '^(latest|[A-Za-z0-9_-]{1,40})$'; then
            echo "refusing activity value: must be 'latest' or an activity id"
            exit 1
          fi
          echo "activity=$activity" >> "$GITHUB_OUTPUT"
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Check out the data branch into derived/
        if: steps.req.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin data > /dev/null; then
            git fetch --depth=1 origin data:data
            git worktree add derived data
          else
            git worktree add --detach derived
            git -C derived switch --orphan data
          fi

      - uses: actions/setup-python@v5
        if: steps.req.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        if: steps.req.outputs.run == 'true'
        run: pip install .

      - name: Analyse
        if: steps.req.outputs.run == 'true'
        env:
          INTERVALS_ICU_API_KEY: ${{ secrets.INTERVALS_ICU_API_KEY }}
          INTERVALS_ICU_ATHLETE_ID: ${{ secrets.INTERVALS_ICU_ATHLETE_ID }}
          ACTIVITY: ${{ steps.req.outputs.activity }}
        run: python -m pipeline.analyse --activity "$ACTIVITY"

      - name: Commit derived/analysis/ to the data branch
        if: always() && steps.req.outputs.run == 'true'
        run: |
          cd derived
          git add analysis
          sh ../.githooks/pre-commit # the same secret check as main
          if git diff --cached --quiet; then
            echo "no analysis changes"
            exit 0
          fi
          git commit -q -m "analysis: $(date +%F) run ${GITHUB_RUN_ID}"
          git reset -q --hard && git clean -fdq # drop the rest of what ingest wrote: only analysis/ is committed here
          for i in 1 2 3; do # the daily run may push to data at the same time
            git pull -q --rebase origin data && git push origin HEAD:refs/heads/data && exit 0
            sleep 5
          done
          exit 1
