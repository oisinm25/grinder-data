# Pedestal morning run, in the cloud: ingest -> readiness -> prescribe -> publish -> review
# (-> weekly on Sundays) -> brief (derived/today.md, today.json). ntfy only alerts on failures.
#
# It fires a few times each morning, and `pipeline.run daily` decides for itself: it exits
# outside the window in config/athlete.yaml `schedule` (06:30-07:00 Europe/Madrid), and once
# today's brief is final (sleep data in). A manual run ignores the window.
#
# State lives on the `data` branch, checked out into derived/. This workflow never writes `main`.
name: daily

on:
  schedule:
    # 06:30-07:00 Madrid: 04:30-05:00 UTC in summer time (CEST), 05:30-06:00 UTC in winter (CET)
    - cron: "30,45 4 * * *"
    - cron: "0 5 * * *"
    - cron: "30,45 5 * * *"
    - cron: "0 6 * * *"
  workflow_dispatch:

# Only what's needed to push the data branch.
permissions:
  contents: write

concurrency: { group: daily, cancel-in-progress: false }

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NTFY_SERVER: ${{ vars.NTFY_SERVER }}
    steps:
      - name: Check out main (code, plan, strength log)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Check out the data branch into derived/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin data > /dev/null; then
            git fetch --depth=1 origin data:data
            git worktree add derived data
          else
            echo "no data branch yet: starting an empty one"
            git worktree add --detach derived
            git -C derived switch --orphan data
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install .

      - name: Daily run
        env:
          INTERVALS_ICU_API_KEY: ${{ secrets.INTERVALS_ICU_API_KEY }}
          INTERVALS_ICU_ATHLETE_ID: ${{ secrets.INTERVALS_ICU_ATHLETE_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -m pipeline.run daily ${{ github.event_name == 'workflow_dispatch' && '--ignore-window' || '' }}

      - name: Commit derived/ to the data branch
        if: always()
        run: |
          cd derived
          git add -A
          sh ../.githooks/pre-commit # the same secret check as main
          if git diff --cached --quiet; then
            echo "no data changes"
            exit 0
          fi
          git commit -q -m "data: $(date +%F) run ${GITHUB_RUN_ID}"
          for i in 1 2 3; do # an on-demand analysis may push to data at the same time
            git pull -q --rebase origin data && git push origin HEAD:refs/heads/data && exit 0
            sleep 5
          done
          exit 1

      - name: Keep the .fit/.zwo files for a week
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workouts-${{ github.run_id }}
          path: exports/
          retention-days: 7
          if-no-files-found: ignore
