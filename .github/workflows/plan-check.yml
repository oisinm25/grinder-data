# On a pull request that touches plans/: validate each changed plan file against config/athlete.yaml,
# refuse changes to the past, and post the plain-English diff against config/plan.yaml as a PR comment.
# It never adopts anything and never writes to the repo: adopting is `pipeline.plan.adopt --yes`.
name: plan-check

on:
  pull_request:
    paths:
      - "plans/**"

# Read the code; write only the PR comment.
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: plan-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # to diff against the base branch

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install .

      - name: Check the changed plans
        id: check
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          status=0
          {
            echo "<!-- pedestal-plan-check -->"
            files=$(git diff --name-only --diff-filter=AM "$BASE" HEAD -- 'plans/*.yaml' 'plans/**/*.yaml' | grep -v '^plans/archive/' || true)
            if [ -z "$files" ]; then
              echo "No plan files changed (only plans/archive/ or other files)."
            fi
            for f in $files; do
              if [ "$f" = "plans/TEMPLATE.yaml" ]; then
                python -m pipeline.plan.schema "$f" --athlete config/athlete.yaml | sed 's/^/    /' || status=1
                continue
              fi
              python -m pipeline.plan.adopt "$f" --format markdown || status=1
              echo
            done
          } > comment.md
          cat comment.md
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Comment on the pull request
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR" --edit-last --body-file comment.md || gh pr comment "$PR" --body-file comment.md

      - name: Fail if a plan is invalid or changes the past
        if: steps.check.outputs.status != '0'
        run: exit 1
