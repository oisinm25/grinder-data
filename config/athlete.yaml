# Athlete anchors for config/plan.yaml (format: docs/plan-format.md; schema: pipeline/athlete.py).
# The plan never carries FTP, LTHR or other anchors; it points at these. Update them
# here after testing. Every lift id the plan uses must be listed under strength.lifts.
schema_version: 1

lthr_bpm: 170

ftp:                             # pct_ftp targets resolve against the session's modality
  bike:     { watts: 340 }       # 20-min test 361 W on 25 Oct 2026, Coll de sa Creu; 95% = 343, rounded down for a climbing test
  handbike: { watts: 252, provisional: true, note: Confirm or replace from the Block 0 20-min hand-bike test }

curves:                          # pct_curve targets: [<key>, pct]; key suffix = duration
  grinding_60s:  { duration_s: 60,  watts: 470 }
  grinding_240s: { duration_s: 240, watts: 301 }

strength:
  rounding_kg: 2.5
  lifts:
    bench_press:         { name: Bench press }
    bench_pull:          { name: Bench pull }
    weighted_pullup:     { name: Weighted pull-up }
    chest_supported_row: { name: Chest-supported row }
    landmine_press:      { name: Landmine press }
    push_press:          { name: Push press }
    trap_bar_deadlift:   { name: Trap-bar deadlift }
    rfe_split_squat:     { name: Rear-foot-elevated split squat }

schedule:                        # when the daily cloud run may go (local time, end inclusive)
  timezone: Europe/Madrid
  window: ["06:30", "07:00"]

readiness:
  rules:                         # the day's colour, computed by pipeline/readiness.py
    baseline_days: 28            # rolling baseline: the 28 days before today
    min_baseline_days: 7         # fewer measured days in the window -> no call
    hrv_sd_below: 1.0            # amber: HRV below baseline mean - 1 SD
    resting_hr_above_bpm: 5      # amber: resting HR more than 5 bpm above baseline mean
    sleep_min_h: 6               # red: sleep under 6 h (red also: both amber triggers at once)
  # effects -- green: the suggestion stands
  amber: { hold_last_weight: true, allow_increment: false, rpe_cap: 8 }
  red:   { pct_of_last_weight: 0.90, rpe_cap: 7 }
