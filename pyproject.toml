[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pedestal"
version = "0.1.0"
description = "Grinder training plan and measurement pipeline"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "PyYAML>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
