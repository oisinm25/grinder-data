[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pedestal"
version = "1.0.0"
description = "Grinder training plan and measurement pipeline"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "matplotlib>=3.8", # the email version's PNG charts
    "pydantic>=2.7,<3",
    "python-dotenv>=1.0",
    "PyYAML>=6",
    "tzdata>=2024.1", # time zones for zoneinfo on Windows (Linux has the system database)
]

[project.optional-dependencies]
dev = ["pytest>=8", "fitdecode>=0.10"]  # fitdecode: independent check of the .fit encoder

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
